server:
  port: 8080

spring:
  application:
    name: pbcs-card-service

  datasource:
    url: jdbc:mysql://localhost:3306/pbcs_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    time-zone: UTC

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true